<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis Court Keypoint Labeler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1a1a2e; color: #eee; display: flex; height: 100vh; overflow: hidden; }

  #sidebar {
    width: 280px; min-width: 280px; background: #16213e; padding: 12px;
    display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  }
  #sidebar h2 { font-size: 14px; color: #e94560; text-transform: uppercase; letter-spacing: 1px; }

  #kp-list { list-style: none; }
  #kp-list li {
    padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;
    border-left: 3px solid transparent; margin-bottom: 2px;
  }
  #kp-list li.active  { background: #0f3460; border-left-color: #e94560; color: #fff; }
  #kp-list li.labeled { border-left-color: #4caf50; color: #aaa; }
  #kp-list li.outside { border-left-color: #ff9800; color: #aaa; text-decoration: line-through; }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #toolbar {
    background: #0f3460; padding: 8px 12px; display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
  }
  #toolbar button {
    background: #e94560; color: #fff; border: none; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 13px;
  }
  #toolbar button:hover { background: #c73652; }
  #toolbar button.secondary { background: #0f3460; border: 1px solid #e94560; }
  #toolbar button.secondary:hover { background: #1a4a7a; }
  #toolbar span { font-size: 13px; color: #aaa; }

  #canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #0d0d1a; cursor: crosshair; }
  canvas { display: block; }

  #status { background: #0f3460; padding: 6px 12px; font-size: 12px; color: #aaa; }

  .progress { background: #0d0d1a; border-radius: 4px; height: 6px; margin-top: 4px; }
  .progress-bar { background: #4caf50; height: 6px; border-radius: 4px; transition: width 0.3s; }

  #ref-img { width: 100%; border-radius: 4px; border: 1px solid #333; margin-top: 4px; }

  input[type=file] { display: none; }
  label.btn {
    background: #e94560; color: #fff; border: none; padding: 6px 12px;
    border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 13px;
    display: inline-block;
  }
  label.btn:hover { background: #c73652; }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Tennis KP Labeler</h2>

  <div>
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">1. Load images folder</div>
    <label class="btn" for="folder-input">📁 Open Folder</label>
    <input type="file" id="folder-input" multiple accept="image/*">
  </div>

  <div id="progress-wrap" style="display:none">
    <div style="font-size:11px;color:#aaa">Progress</div>
    <div class="progress"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
    <div id="prog-label" style="font-size:11px;color:#aaa;margin-top:2px;">0 / 0 labelled</div>
  </div>

  <div>
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">2. Click each keypoint in order</div>
    <ul id="kp-list"></ul>
  </div>

  <div>
    <div style="font-size:11px;color:#aaa;margin-bottom:4px;">Controls</div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      <button onclick="markOutside()">⬛ Mark as off-screen (O)</button>
      <button class="secondary" onclick="undoLast()">↩ Undo last (U)</button>
      <button class="secondary" onclick="skipImage()">⏭ Skip image (S)</button>
      <button class="secondary" onclick="prevImage()">◀ Previous (←)</button>
      <button onclick="exportJSON()">💾 Export JSON</button>
    </div>
  </div>

  <div>
    <div style="font-size:11px;color:#aaa;">Reference diagram</div>
    <img id="ref-img" src="" alt="Load keypoint_reference.png separately">
    <div style="font-size:10px;color:#666;margin-top:2px;">
      <label class="btn" style="font-size:10px;padding:3px 8px;" for="ref-input">Load reference</label>
      <input type="file" id="ref-input" accept="image/*">
    </div>
  </div>
</div>

<div id="main">
  <div id="toolbar">
    <button onclick="prevImage()">◀ Prev</button>
    <button onclick="nextImage()">Next ▶</button>
    <span id="img-counter">No images loaded</span>
    <span id="kp-hint" style="color:#e94560;"></span>
    <button class="secondary" onclick="zoomIn()">＋ Zoom</button>
    <button class="secondary" onclick="zoomOut()">－ Zoom</button>
    <button class="secondary" onclick="resetZoom()">Reset zoom</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Click on the canvas to place keypoints. Press O to mark off-screen, U to undo, S to skip.</div>
</div>

<script>
const KP_NAMES = [
  "0 far-left doubles",   "1 far-right doubles",
  "2 near-left doubles",  "3 near-right doubles",
  "4 far-left singles",   "5 near-left singles",
  "6 far-right singles",  "7 near-right singles",
  "8 far-left service",   "9 far-right service",
  "10 near-left service", "11 near-right service",
  "12 far center T",      "13 near center T",
];
const NUM_KP = 14;
const COLORS = [
  '#e94560','#ff6b6b','#4ecdc4','#45b7d1','#96ceb4','#ffeaa7',
  '#dda0dd','#98d8c8','#f7dc6f','#bb8fce','#85c1e9','#82e0aa',
  '#f0b27a','#aab7b8'
];

let images = [];          // {name, src, width, height}
let annotations = {};     // name → [{x,y,v}, ...] length=NUM_KP or sparse
let currentIdx = 0;
let currentKP  = 0;       // which keypoint we're placing next
let zoom = 1.0;
let imgEl = new Image();

const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const kpList  = document.getElementById('kp-list');
const counter = document.getElementById('img-counter');
const hint    = document.getElementById('kp-hint');
const status  = document.getElementById('status');

// ── Build KP list ─────────────────────────────────────────────────────────────
function buildKPList() {
  kpList.innerHTML = '';
  KP_NAMES.forEach((name, i) => {
    const li = document.createElement('li');
    li.id = `kp-${i}`;
    li.textContent = name;
    li.onclick = () => jumpToKP(i);
    kpList.appendChild(li);
  });
}
buildKPList();

// ── File loading ─────────────────────────────────────────────────────────────
document.getElementById('folder-input').addEventListener('change', e => {
  const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
  files.sort((a,b) => a.name.localeCompare(b.name));
  images = [];
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        images.push({ name: file.name, src: ev.target.result, width: img.width, height: img.height });
        loaded++;
        if (loaded === files.length) {
          images.sort((a,b) => a.name.localeCompare(b.name));
          currentIdx = 0;
          loadImage(0);
          document.getElementById('progress-wrap').style.display = 'block';
          updateProgress();
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
});

document.getElementById('ref-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { document.getElementById('ref-img').src = ev.target.result; };
  reader.readAsDataURL(file);
});

// ── Image loading & drawing ───────────────────────────────────────────────────
function loadImage(idx) {
  if (idx < 0 || idx >= images.length) return;
  currentIdx = idx;
  currentKP  = firstUnlabeled();
  imgEl = new Image();
  imgEl.onload = () => { resetZoom(); redraw(); };
  imgEl.src = images[idx].src;
  if (!annotations[images[idx].name]) {
    annotations[images[idx].name] = Array(NUM_KP).fill(null);
  }
  counter.textContent = `${idx+1} / ${images.length}  —  ${images[idx].name}`;
  updateKPList();
  updateProgress();
  status.textContent = `Loaded: ${images[idx].name}`;
}

function firstUnlabeled() {
  const ann = currentAnnotations();
  if (!ann) return 0;
  for (let i = 0; i < NUM_KP; i++) if (ann[i] === null) return i;
  return NUM_KP; // all done
}

function currentAnnotations() {
  if (!images[currentIdx]) return null;
  return annotations[images[currentIdx].name];
}

function redraw() {
  if (!imgEl.src) return;
  const img = images[currentIdx];
  canvas.width  = Math.round(img.width  * zoom);
  canvas.height = Math.round(img.height * zoom);
  ctx.drawImage(imgEl, 0, 0, canvas.width, canvas.height);

  const ann = currentAnnotations();
  if (!ann) return;

  // Draw placed keypoints
  ann.forEach((kp, i) => {
    if (!kp) return;
    const x = kp.x * zoom;
    const y = kp.y * zoom;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI*2);
    ctx.fillStyle = kp.v === 0 ? '#ff9800' : COLORS[i];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px monospace';
    ctx.fillText(i, x+7, y+4);
  });

  // Highlight current keypoint slot
  if (currentKP < NUM_KP) {
    hint.textContent = `Next → ${KP_NAMES[currentKP]}`;
  } else {
    hint.textContent = '✓ All keypoints placed';
  }
  updateKPList();
}

// ── Canvas click ──────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (!images.length || currentKP >= NUM_KP) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoom;
  const y = (e.clientY - rect.top)  / zoom;
  const ann = currentAnnotations();
  ann[currentKP] = { x, y, v: 2 };
  currentKP = firstUnlabeled();
  redraw();
  if (currentKP >= NUM_KP) {
    status.textContent = '✓ All keypoints placed! Press → to go to next image.';
    updateProgress();
  } else {
    status.textContent = `Placed KP ${currentKP-1}. Next: ${KP_NAMES[currentKP]}`;
  }
});

// ── Controls ──────────────────────────────────────────────────────────────────
function markOutside() {
  if (!images.length || currentKP >= NUM_KP) return;
  const ann = currentAnnotations();
  ann[currentKP] = { x: -1, y: -1, v: 0 }; // off-screen
  status.textContent = `KP ${currentKP} marked off-screen.`;
  currentKP = firstUnlabeled();
  redraw();
  if (currentKP >= NUM_KP) updateProgress();
}

function undoLast() {
  const ann = currentAnnotations();
  if (!ann) return;
  // Find last labeled kp
  for (let i = NUM_KP-1; i >= 0; i--) {
    if (ann[i] !== null) { ann[i] = null; currentKP = i; redraw(); return; }
  }
}

function jumpToKP(i) {
  currentKP = i;
  const ann = currentAnnotations();
  if (ann) ann[i] = null; // re-label
  redraw();
}

function prevImage() { if (currentIdx > 0) loadImage(currentIdx-1); }
function nextImage() { if (currentIdx < images.length-1) loadImage(currentIdx+1); }
function skipImage() { nextImage(); }

function zoomIn()    { zoom = Math.min(zoom * 1.3, 5);   redraw(); }
function zoomOut()   { zoom = Math.max(zoom / 1.3, 0.2); redraw(); }
function resetZoom() {
  if (!images[currentIdx]) return;
  const wrap = document.getElementById('canvas-wrap');
  zoom = Math.min(
    (wrap.clientWidth  - 20) / images[currentIdx].width,
    (wrap.clientHeight - 20) / images[currentIdx].height,
    1.5
  );
  redraw();
}

// ── KP list update ────────────────────────────────────────────────────────────
function updateKPList() {
  const ann = currentAnnotations();
  KP_NAMES.forEach((_, i) => {
    const li = document.getElementById(`kp-${i}`);
    if (!li) return;
    li.className = '';
    if (i === currentKP) li.className = 'active';
    else if (ann && ann[i] !== null) {
      li.className = ann[i].v === 0 ? 'outside' : 'labeled';
    }
  });
}

// ── Progress ──────────────────────────────────────────────────────────────────
function updateProgress() {
  let done = 0;
  images.forEach(img => {
    const ann = annotations[img.name];
    if (ann && ann.every(kp => kp !== null)) done++;
  });
  const pct = images.length ? (done/images.length*100).toFixed(0) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done} / ${images.length} fully labelled`;
}

// ── Export JSON ───────────────────────────────────────────────────────────────
function exportJSON() {
  const imagesArr = [], annsArr = [];
  images.forEach((img, idx) => {
    imagesArr.push({ id: idx+1, file_name: img.name, width: img.width, height: img.height });
    const ann = annotations[img.name];
    if (!ann) return;
    const kps = [];
    ann.forEach(kp => {
      if (kp === null) { kps.push(0, 0, 0); }        // not labelled
      else if (kp.v === 0) { kps.push(0, 0, 0); }    // off-screen
      else { kps.push(Math.round(kp.x), Math.round(kp.y), 2); }
    });
    annsArr.push({ id: idx+1, image_id: idx+1, keypoints: kps, num_keypoints: 14 });
  });

  const out = JSON.stringify({ images: imagesArr, annotations: annsArr }, null, 2);
  const blob = new Blob([out], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'annotations.json';
  a.click();
  status.textContent = `Exported ${annsArr.length} annotations.`;
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') nextImage();
  else if (e.key === 'ArrowLeft') prevImage();
  else if (e.key.toLowerCase() === 'o') markOutside();
  else if (e.key.toLowerCase() === 'u') undoLast();
  else if (e.key.toLowerCase() === 's') skipImage();
  else if (e.key === '+' || e.key === '=') zoomIn();
  else if (e.key === '-') zoomOut();
});

window.addEventListener('resize', resetZoom);
</script>
</body>
</html>
